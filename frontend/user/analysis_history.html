<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatLens - Analysis History</title>

    <link rel="stylesheet" href="css/analysis_history.css">
    <link rel="stylesheet" href="css/header.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<!-- NAVBAR -->
    <div id="header"></div>


<!-- ================= MAIN ================= -->

<main class="container">

    <!-- HEADER -->

    <section class="page-header">

        <div class="header-left">

            <div class="eyebrow">
                <i data-lucide="shield"></i>
                SAVED SAFETY REPORTS
            </div>

            <h1>Analysis history</h1>

            <p>
                Review your previously analyzed emails.
            </p>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <i data-lucide="search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search subject or file name"
            >

        </div>

    </section>


    <!-- ================= FILTER BAR ================= -->

    <div class="filter-bar">

        <div class="filters">

            <button class="filter active" data-filter="all">
                All
            </button>

            <button class="filter" data-filter="Safe">
                Safe
            </button>

            <button class="filter" data-filter="Suspicious">
                Suspicious
            </button>

            <button class="filter" data-filter="High Risk">
                High Risk
            </button>

            <button class="filter" data-filter="Critical">
                Critical
            </button>

        </div>


        <button class="sort-btn">
            Newest first
            <i data-lucide="chevron-down"></i>
        </button>

    </div>


    <!-- ================= HISTORY LIST ================= -->

    <section class="history-list" id="historyList">
    </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <div>
        <i data-lucide="lock"></i>
        Your emails are analyzed securely and never shared.
    </div>

    <div>
        © 2024 ThreatLens · Privacy · Terms
    </div>

</footer>


<script src="js/analysis_history.js"></script>
<script src="js/header.js"></script>

</body>
</html>
